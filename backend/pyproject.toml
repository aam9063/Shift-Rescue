[project]
name = "shift-rescue-backend"
version = "0.1.0"
description = "Shift Rescue backend: AI agent that covers last-minute shift absences over WhatsApp."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "structlog>=24.1",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "tzdata>=2026.4",
    "strands-agents==1.56.0",
    "openai>=1.68",  # provider SDK for LLM_PROVIDER=openai (strands extra floor)
    "opentelemetry-api>=1.44",  # matches the version strands already pulls in
    "opentelemetry-sdk>=1.44",
    "opentelemetry-exporter-otlp-proto-http>=1.44",  # Langfuse Cloud OTLP/HTTP
    "python-multipart>=0.0.32",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "ruff>=0.6",
    "mypy>=1.11",
    "hypothesis>=6.168.1",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires a running PostgreSQL (skipped without DATABASE_URL)",
]

[tool.coverage.run]
source = ["app/domain"]

[tool.coverage.report]
# Spec Feature 1 DoD: domain coverage gate. Never relaxed (§0 rule 4).
fail_under = 95
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI dependency injection idiom.
"app/api/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
plugins = []
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["celery.*", "alembic.*"]
ignore_missing_imports = true
